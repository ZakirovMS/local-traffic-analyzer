name: "Сообщение об ошибке"
description: "Сообщить о неожиданном поведении или неисправности"
title: "[BUG] "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: Описание
      description: Что произошло?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Шаги для воспроизведения
      description: Какие действия приводят к возникновению ошибки?
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
      description: Как приложение должно было себя вести?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
      description: Как приложение ведёт себя на самом деле?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Окружение
      description: "Условия возникновения ошибки: ОС, браузер, версия приложения, Docker и т. д."
    validations:
      required: false
