name: "Обсуждение"
description: "Обсудить архитектуру и детали реализации"
title: "[DISCUSSION] "
labels:
  - discussion
body:
  - type: markdown
    attributes:
      value: |
        Используйте это обсуждение для рассмотрения технического вопроса и согласования решений.

  - type: textarea
    id: topic
    attributes:
      label: Тема обсуждения
      description: Что необходимо обсудить?
    validations:
      required: true

  - type: textarea
    id: questions
    attributes:
      label: Вопросы
      description: Что именно необходимо выяснить или согласовать?
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: proposals
    attributes:
      label: Предложения
      description: Возможные варианты реализации или решения проблемы.
    validations:
      required: false

  - type: textarea
    id: decision
    attributes:
      label: Итоговое решение
      description: Заполните после завершения обсуждения.
    validations:
      required: false
