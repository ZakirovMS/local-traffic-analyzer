name: "Задача"
description: "Создать задачу"
title: "[TASK] "
labels:
  - task
body:
  - type: markdown
    attributes:
      value: |
        Опишите одну конкретную задачу.

  - type: textarea
    id: description
    attributes:
      label: Описание
      description: Что необходимо сделать?
      placeholder: Опишите ожидаемый результат.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Контекст
      description: Дополнительная информация, ссылки, принятые решения или технические детали.
    validations:
      required: false

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Критерий успешного выполнения
      description: При каких условиях задача считается выполненной?
      placeholder: |
        - [ ] Необходимая функциональность реализована
        - [ ] Изменения протестированы
        - [ ] Документация обновлена при необходимости
    validations:
      required: true
