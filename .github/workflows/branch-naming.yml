name: Lint Branch name

on:
  pull_request:
    branches: [master]

permissions:
  pull-requests: read

jobs:
  check-branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Verify branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          echo "Verify branch name: $BRANCH"

          PATTERN="^[a-z0-9]+(-[a-z0-9]+)*/[a-z0-9]+(-[a-z0-9]+)*$"

          if [[ "$BRANCH" =~ $PATTERN ]]
          then
            echo "The branch name follows the rules."
          else
            echo "WARNING: The branch name does not follow the rules!"
            echo "Pattern: <second-name>/<short-description>"
            echo "Examples: maslevtsov/add-onnx, sveshnikov/ci-commitlint"
            exit 1
          fi
